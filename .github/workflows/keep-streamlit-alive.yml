name: Flagship health check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flagship-health-check
  cancel-in-progress: true

jobs:
  health:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: BA Assistant
            url: https://tshaik1990-ba-assistant.hf.space/_stcore/health
          - name: BA Jira Agent
            url: https://tshaik1990-ba-jira-agent.hf.space/_stcore/health
          - name: Stock Research Assistant
            url: https://tshaik1990-stock-research-assistant.hf.space/_stcore/health
    steps:
      - name: Check public health endpoint
        env:
          HEALTH_URL: ${{ matrix.url }}
        run: |
          response=$(curl --fail --silent --show-error \
            --location --max-time 30 --retry 2 --retry-all-errors \
            "$HEALTH_URL")
          test "$response" = "ok"
